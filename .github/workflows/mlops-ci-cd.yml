name: CardioAgent-Ops CI/CD

on:
  push:
    branches:
      - main
      - chore/setup-ci-cd

  pull_request:
    branches:
      - main

jobs:
  test-api:
    name: Test API Gateway
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=main --cov-report=term-missing -v   

  test-rag:
    name: Test RAG Engine
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rag-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=rag_processing --cov-report=term-missing -v

  test-audio:
    name: Test Audio Engine
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: audio-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=audio_processing --cov-report=term-missing -v
    
