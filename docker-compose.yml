# CardioAgent-Ops — whole platform
#   docker compose up --build
#
#   api-gateway   http://localhost:8000/docs   (Service 5)
#   audio-engine  http://localhost:8002/docs   (Service 3)
#   rag-engine    http://localhost:8003/docs   (RAG)
#   vector-db     http://localhost:6333/dashboard (Service 2)
#
# Inside the network, services call each other by name, e.g. http://rag-engine:8000
services:

  api-gateway:
    build: ./api
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - audio-engine
      - rag-engine
    networks:
      - cardio-net

  audio-engine:
    build: ./audio-engine
    ports:
      - "${AUDIO_PORT:-8002}:8000"
    networks:
      - cardio-net

  vector-db:
    image: qdrant/qdrant:${QDRANT_VERSION:-latest}
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - cardio-net

  rag-engine:
    build:
      context: ./rag-engine
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    ports:
      - "${RAG_PORT:-8003}:8000"
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://vector-db:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-esc_guidelines}
      CHUNK_SIZE: ${CHUNK_SIZE:-200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-40}
      TOP_K: ${TOP_K:-4}
      DOCS_DIR: /app/docs
    volumes:
      - ./rag-engine/docs:/app/docs:ro
    depends_on:
      - vector-db
    networks:
      - cardio-net

volumes:
  qdrant-data:

networks:
  cardio-net:
