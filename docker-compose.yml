# CardioAgent-Ops — whole platform
#   docker compose up --build
#
#   api-gateway         http://localhost:8000/docs   (Service 5)
#   audio-engine        http://localhost:8002/docs   (Service 3)
#   rag-engine          http://localhost:8003/docs   (RAG)
#   agent-orchestrator  http://localhost:8004/docs   (Service 4)
#   vector-db           http://localhost:6333/dashboard (Service 2)
#   mlflow              http://localhost:5000        (experiments, model registry, LLM traces)
#
# Inside the network, services call each other by name, e.g. http://rag-engine:8000
services:

  api-gateway:
    build: ./api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      AUDIO_ENGINE_URL: http://audio-engine:8000
      ORCHESTRATOR_URL: http://agent-orchestrator:8000
    depends_on:
      - audio-engine
      - agent-orchestrator
    networks:
      - cardio-net

  audio-engine:
    build: ./audio-engine
    ports:
      - "${AUDIO_PORT:-8002}:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-heart-sound-classifier}
      MODEL_ALIAS: ${MODEL_ALIAS:-production}
    volumes:
      # Only used by `docker compose run audio-engine python train.py data`
      - ./ourdataset/ourdataset/train:/app/data:ro
    depends_on:
      - mlflow
    networks:
      - cardio-net

  vector-db:
    image: qdrant/qdrant:${QDRANT_VERSION:-latest}
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - cardio-net

  rag-engine:
    build:
      context: ./rag-engine
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    ports:
      - "${RAG_PORT:-8003}:8000"
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://vector-db:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-esc_guidelines}
      CHUNK_SIZE: ${CHUNK_SIZE:-200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-40}
      TOP_K: ${TOP_K:-4}
      DOCS_DIR: /app/docs
    volumes:
      - ./rag-engine/docs:/app/docs:ro
    depends_on:
      - vector-db
    networks:
      - cardio-net

  agent-orchestrator:
    build: ./agent-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8004}:8000"
    environment:
      RAG_URL: http://rag-engine:8000
      OLLAMA_URL: http://llm:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      TOP_K: ${TOP_K:-4}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - rag-engine
      - llm
      - mlflow
    networks:
      - cardio-net

  # Local LLM (Ollama). Replace LLM_MODEL by the fine-tuned model once it exists.
  llm:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - cardio-net

  # Downloads LLM_MODEL into the llm volume, then exits (instant once cached)
  llm-pull:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    environment:
      OLLAMA_HOST: http://llm:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-llama3.2:3b}"]
    depends_on:
      - llm
    restart: on-failure
    networks:
      - cardio-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*
    volumes:
      - mlflow-data:/mlflow
    networks:
      - cardio-net

volumes:
  qdrant-data:
  ollama-data:
  mlflow-data:

networks:
  cardio-net:
